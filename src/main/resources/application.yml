spring:
  application:
    name: rag-pipeline-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' for local dev speed; a real prod setup would use Flyway/Liquibase
      # migrations instead - worth mentioning this is a deliberate dev-only shortcut.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ---- RAG-specific configuration ----
# Everything here is intentionally externalized (not hardcoded) so every
# number has a one-line justification ready if asked in interview.
rag:
  chunking:
    chunk-size-chars: 800       # ~ approximates 400-500 tokens for typical English text
    overlap-percent: 15         # prevents losing context that straddles chunk boundaries
  retrieval:
    top-k: 3                    # inject top 3 chunks, not just 1 (Risk #6)
    similarity-threshold: 0.80   # chosen experimentally against sample queries; tune here without redeploying
  context:
    max-context-tokens: 6000    # retrieved chunks are trimmed to this budget before prompting (Risk #10)

openai:
  api-key: ${OPENAI_API_KEY}
  embedding-model: text-embedding-3-small
  base-url: https://api.openai.com/v1

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
  base-url: https://api.anthropic.com/v1
