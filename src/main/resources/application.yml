spring:
  application:
    name: rag-pipeline-service

  datasource:
    url: jdbc:postgresql://ep-falling-union-ayas6n2k-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_gCaGK1jN6hqA
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' for local dev speed; a real prod setup would use Flyway/Liquibase
      # migrations instead - worth mentioning this is a deliberate dev-only shortcut.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ---- RAG-specific configuration ----
# Everything here is intentionally externalized (not hardcoded) so every
# number has a one-line justification ready if asked in interview.
rag:
  chunking:
    chunk-size-chars: 800       # ~ approximates 400-500 tokens for typical English text
    overlap-percent: 15         # prevents losing context that straddles chunk boundaries
  retrieval:
    top-k: 3                    # inject top 3 chunks, not just 1 (Risk #6)
    similarity-threshold: 0.60   # chosen experimentally against sample queries; tune here without redeploying
  context:
    max-context-tokens: 6000    # retrieved chunks are trimmed to this budget before prompting (Risk #10)

gemini:
  api-key: ${GEMINI_API_KEY}
  embedding-model: gemini-embedding-001
  generation-model: gemini-2.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta
